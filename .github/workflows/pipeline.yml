# Tutorial stage 3: test, build, then publish the report to GitHub Pages.
# Copy it into place with:   cp tutorial/pipeline-3-deploy.yml .github/workflows/pipeline.yml
name: Pipeline

# WHEN it runs: a push to main, every pull request, and the "Run workflow" button.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The token GitHub gives these jobs can only read the code.
permissions:
  contents: read

jobs:
  test:
    # WHERE it runs: a fresh Linux computer that GitHub lends you.
    runs-on: ubuntu-latest
    # WHAT it does: the same commands you ran by hand in Part B.
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the tools
        run: pip install -r requirements.txt

      - name: Check the data
        run: python src/qc.py

      - name: Run the unit tests
        run: pytest -v

  build:
    # Starts only after the test job has passed.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the tools
        run: pip install -r requirements.txt

      - name: Build the report
        run: python src/report.py

      - name: Package the report for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Starts only after the build job has passed, and only for main:
    # a pull request is tested and built, but never published.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # This job, and only this job, may publish to GitHub Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publish the report
        id: deployment
        uses: actions/deploy-pages@v5
